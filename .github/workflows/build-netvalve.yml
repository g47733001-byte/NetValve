name: Build NetValve (Netstack ARM64)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: netvalve-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: auto
  NDK_VERSION: "27.2.12479018"
  BUILD_TOOLS_VERSION: "35.0.0"
  APK_NAME: app-netstack-arm64-debug.apk

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true
          cache-dependency-path: netstack/go.sum

      - name: Install Android SDK platform, build-tools and NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;${BUILD_TOOLS_VERSION}" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install gomobile and gobind
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init
          go version
          gomobile version || true

      - name: Build netstack AAR (gVisor)
        run: |
          chmod +x netstack/build-aar.sh gradlew
          cd netstack
          go get -tool golang.org/x/mobile/cmd/gobind
          ./build-aar.sh
          cd ..
          test -f app/libs/netstack.aar || { echo "::error::app/libs/netstack.aar was not produced"; exit 1; }
          ls -l app/libs/netstack.aar
          unzip -l app/libs/netstack.aar | tee /tmp/aar-listing.txt
          grep -q 'jni/arm64-v8a/.*\.so' /tmp/aar-listing.txt || { echo "::error::netstack.aar has no arm64-v8a native library"; exit 1; }

      - name: Generate AndroidManifest.xml if missing
        run: |
          python3 - <<'PY'
          import os, re, sys, pathlib

          root = pathlib.Path("app")
          mf = root / "src/main/AndroidManifest.xml"
          if mf.exists():
              print("AndroidManifest.xml already exists; nothing to generate.")
              sys.exit(0)

          gp = root / "build.gradle.kts"
          gradle = gp.read_text(errors="ignore") if gp.exists() else ""
          m = re.search(r'namespace\s*=\s*"([^"]+)"', gradle)
          namespace = m.group(1) if m else "dev.netvalve"

          src = root / "src/main"
          files = list(src.rglob("*.kt"))
          if not files:
              print("::error::No Kotlin sources under app/src/main; cannot generate a manifest")
              sys.exit(1)

          SUPERS = {
              "application": r'(?<![\w.])Application\s*\(',
              "activity": r'(?<![\w.])(?:ComponentActivity|AppCompatActivity|FragmentActivity|Activity)\s*\(',
              "vpn": r'(?<![\w.])VpnService\s*\(',
              "receiver": r'(?<![\w.])BroadcastReceiver\s*\(',
              "service": r'(?<![\w.])(?:LifecycleService|Service)\s*\(',
          }
          found = {k: set() for k in SUPERS}
          all_text = ""
          for p in files:
              t = p.read_text(errors="ignore")
              all_text += t + "\n"
              pm = re.search(r'^\s*package\s+([\w.]+)', t, re.M)
              pkg = pm.group(1) if pm else ""
              classes = list(re.finditer(r'(?<![\w:.])class\s+(\w+)', t))
              for kind, pat in SUPERS.items():
                  for sm in re.finditer(pat, t):
                      prev = [c for c in classes if c.end() <= sm.start()]
                      if not prev:
                          continue
                      c = prev[-1]
                      between = t[c.end():sm.start()]
                      if "{" in between or ":" not in between:
                          continue
                      before = t[max(0, c.start() - 40):c.start()]
                      if re.search(r'\babstract\s+(?:\w+\s+)*$', before):
                          continue
                      name = c.group(1)
                      found[kind].add(pkg + "." + name if pkg else name)

          print("Detected classes:")
          for k, v in found.items():
              print("  " + k + ": " + ", ".join(sorted(v)))

          if not found["vpn"]:
              print("::error::No VpnService subclass found in app/src/main; cannot generate manifest")
              sys.exit(1)
          if not found["activity"]:
              print("::error::No Activity found in app/src/main; cannot generate manifest")
              sys.exit(1)
          if not found["application"]:
              print("::warning::No Application subclass found; Hilt may fail at runtime")

          camel = {
              "SYSTEM_EXEMPTED": "systemExempted",
              "SPECIAL_USE": "specialUse",
              "CONNECTED_DEVICE": "connectedDevice",
              "DATA_SYNC": "dataSync",
              "REMOTE_MESSAGING": "remoteMessaging",
          }
          fg = sorted({k for k in re.findall(r'FOREGROUND_SERVICE_TYPE_([A-Z_]+)', all_text) if k in camel})
          if not fg:
              fg = ["SYSTEM_EXEMPTED"]
          fg_attr = "|".join(camel[k] for k in fg)

          res = src / "res"
          def has_res(prefix, stem):
              return any(p.stem == stem for d in res.glob(prefix + "*") for p in d.glob("*"))
          values_text = "".join(p.read_text(errors="ignore") for p in res.glob("values*/*.xml"))
          label = "@string/app_name" if 'name="app_name"' in values_text else "NetValve"
          styles = []
          for s in re.findall(r'<style\s+name="([^"]+)"', values_text):
              if s not in styles:
                  styles.append(s)
          theme = None
          for s in styles:
              if "NetValve" in s and "Splash" not in s:
                  theme = "@style/" + s
                  break
          if theme is None:
              for s in styles:
                  if "Theme" in s and "Splash" not in s:
                      theme = "@style/" + s
                      break
          if theme is None:
              theme = "@android:style/Theme.Material.NoActionBar"

          app_attrs = ['android:allowBackup="false"', 'android:label="' + label + '"', 'android:supportsRtl="true"']
          if has_res("mipmap", "ic_launcher"):
              app_attrs.append('android:icon="@mipmap/ic_launcher"')
              if has_res("mipmap", "ic_launcher_round"):
                  app_attrs.append('android:roundIcon="@mipmap/ic_launcher_round"')
          elif has_res("drawable", "ic_launcher"):
              app_attrs.append('android:icon="@drawable/ic_launcher"')
          app_attrs.append('android:theme="' + theme + '"')
          if found["application"]:
              app_attrs.insert(0, 'android:name="' + sorted(found["application"])[0] + '"')

          perms = ["INTERNET", "ACCESS_NETWORK_STATE", "ACCESS_WIFI_STATE", "FOREGROUND_SERVICE",
                   "POST_NOTIFICATIONS", "RECEIVE_BOOT_COMPLETED", "QUERY_ALL_PACKAGES",
                   "REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"]
          perms += ["FOREGROUND_SERVICE_" + k for k in fg]
          for pr in re.findall(r'(?:android\.permission|Manifest\.permission)\.([A-Z_]+)', all_text):
              if pr not in perms and pr != "BIND_VPN_SERVICE":
                  perms.append(pr)

          acts = sorted(found["activity"])
          launcher = next((a for a in acts if a.endswith(".MainActivity") or a == "MainActivity"), acts[0])

          out = ['<?xml version="1.0" encoding="utf-8"?>',
                 '<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '']
          for pr in perms:
              out.append('    <uses-permission android:name="android.permission.' + pr + '" />')
          out += ['', '    <application', *['        ' + a for a in app_attrs[:-1]],
                  '        ' + app_attrs[-1] + '>', '']
          for a in acts:
              if a == launcher:
                  out += ['        <activity android:name="' + a + '" android:exported="true">',
                          '            <intent-filter>',
                          '                <action android:name="android.intent.action.MAIN" />',
                          '                <category android:name="android.intent.category.LAUNCHER" />',
                          '            </intent-filter>',
                          '        </activity>']
              else:
                  out.append('        <activity android:name="' + a + '" android:exported="false" />')
          for s in sorted(found["vpn"]):
              out += ['        <service',
                      '            android:name="' + s + '"',
                      '            android:exported="true"',
                      '            android:permission="android.permission.BIND_VPN_SERVICE"',
                      '            android:foregroundServiceType="' + fg_attr + '">',
                      '            <intent-filter>',
                      '                <action android:name="android.net.VpnService" />',
                      '            </intent-filter>']
              if "SPECIAL_USE" in fg:
                  out += ['            <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"',
                          '                android:value="vpn" />']
              out.append('        </service>')
          for s in sorted(found["service"]):
              out.append('        <service android:name="' + s + '" android:exported="false" />')
          for r in sorted(found["receiver"]):
              if "boot" in r.lower():
                  out += ['        <receiver android:name="' + r + '" android:exported="true">',
                          '            <intent-filter>',
                          '                <action android:name="android.intent.action.BOOT_COMPLETED" />',
                          '            </intent-filter>',
                          '        </receiver>']
              else:
                  out.append('        <receiver android:name="' + r + '" android:exported="false" />')
          out += ['', '    </application>', '', '</manifest>', '']

          mf.write_text("\n".join(out))
          print("---- GENERATED app/src/main/AndroidManifest.xml ----")
          print(mf.read_text())
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("MANIFEST_GENERATED=true\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("### Warning\nAndroidManifest.xml was missing in the repository and was GENERATED by this workflow from the sources. It is not the author's original file.\n")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build APK with netstack engine
        run: ./gradlew :app:assembleDebug -Pnetvalve.netstack=true --stacktrace

      - name: Verify APK is the real Netstack ARM64 build
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name "$APK_NAME" -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::$APK_NAME not found. This means the netstack variant was NOT built (possibly Loopback)."
            find app/build/outputs -name '*.apk' -print || true
            exit 1
          fi
          echo "Found: $APK"

          mkdir -p dist /tmp/apkchk
          cp "$APK" "dist/$APK_NAME"
          if [ "${MANIFEST_GENERATED:-}" = "true" ]; then
            cp app/src/main/AndroidManifest.xml dist/generated-AndroidManifest.xml
          fi
          unzip -l "$APK" > dist/apk-listing.txt

          grep -E 'lib/arm64-v8a/.*\.so' dist/apk-listing.txt > /tmp/arm64-libs.txt || {
            echo "::error::No lib/arm64-v8a/*.so inside the APK"; exit 1; }
          cat /tmp/arm64-libs.txt

          grep -q 'lib/arm64-v8a/libgojni.so' dist/apk-listing.txt || {
            echo "::error::libgojni.so (gomobile/Go netstack bridge) missing from APK"; exit 1; }

          unzip -o -q "$APK" 'lib/arm64-v8a/libgojni.so' -d /tmp/apkchk
          SO=/tmp/apkchk/lib/arm64-v8a/libgojni.so
          readelf -h "$SO" > /tmp/readelf.txt
          grep -q 'AArch64' /tmp/readelf.txt || { echo "::error::libgojni.so is not AArch64"; exit 1; }
          strings -a "$SO" > /tmp/so-strings.txt
          GV="$(grep -ci 'gvisor' /tmp/so-strings.txt || true)"
          echo "gvisor string matches in libgojni.so: $GV"
          [ "${GV:-0}" -gt 0 ] || { echo "::error::No gVisor symbols found in libgojni.so"; exit 1; }

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/apksigner" verify --print-certs "$APK"

          (cd dist && sha256sum "$APK_NAME" > SHA256SUMS.txt && cat SHA256SUMS.txt)
          {
            echo "### NetValve Netstack ARM64 build verified"
            echo "- APK: \`$APK_NAME\` ($(du -h "dist/$APK_NAME" | cut -f1))"
            echo "- libgojni.so: AArch64, gVisor matches = $GV"
            echo "- Unit tests: passed"
            echo "- SHA-256: \`$(cut -d' ' -f1 dist/SHA256SUMS.txt)\`"
            if [ "${MANIFEST_GENERATED:-}" = "true" ]; then
              echo "- WARNING: AndroidManifest.xml was generated by this workflow, not taken from the repository"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetValve-netstack-arm64-debug
          path: |
            dist/app-netstack-arm64-debug.apk
            dist/SHA256SUMS.txt
            dist/apk-listing.txt
            dist/generated-AndroidManifest.xml
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests
            app/build/test-results
          if-no-files-found: ignore
